<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transformable Box — by Noor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box} [hidden]{display:none!important}
:root{
  --paper:#ece3d4; --sheet:#fbf7f0; --ink:#3a3127; --muted:#8a7c69; --line:#ded2bd;
  --accent:#b06a3c; --accent-ink:#ffffff; --sky:#e7ddcb;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1c1812; --sheet:#262019; --ink:#ece3d4; --muted:#a99a84; --line:#3a3127;
  --accent:#d98a56; --accent-ink:#1c1812; --sky:#201b14; color-scheme:dark}}
html,body{height:100%;margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--sheet);border-bottom:1px solid var(--line)}
.brand h1{font:700 clamp(1rem,4.6vw,1.25rem)/1.1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;margin:0}
.brand p{margin:3px 0 0;font-size:.72rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.by{flex:none;font:600 .9rem var(--font-display);color:var(--accent);letter-spacing:.02em}
.by b{font-style:italic;font-weight:700}
.stage{position:relative;flex:1;min-height:0;background:var(--sky);touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.grabbing{cursor:grabbing}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;
  font:500 .74rem var(--font-body);color:var(--ink);background:color-mix(in srgb,var(--sheet) 92%,transparent);
  border:1px solid var(--line);padding:7px 14px;border-radius:999px;box-shadow:0 4px 18px rgb(0 0 0 /.12);transition:opacity .5s ease}
.hint.gone{opacity:0;pointer-events:none}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:500 .9rem var(--font-body);
  color:var(--muted);background:var(--sheet);padding:10px 14px;border-radius:10px;border:1px solid var(--line)}
.dock{background:var(--sheet);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;
  padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.caption{display:flex;gap:10px;align-items:baseline;min-height:2.4em}
.caption b{font:700 .92rem var(--font-display)}
.caption span{font-size:.82rem;color:var(--muted);line-height:1.35}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;cursor:pointer;
  font:600 .9rem var(--font-body);transition:background-color .18s ease,border-color .18s ease,color .18s ease}
.seg button small{font-weight:500;font-size:.66rem;color:var(--muted)}
.seg button:hover{border-color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--paper))}
.seg button[aria-pressed="true"] small{color:var(--accent)}
.dims{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:.7rem;color:var(--muted)}
.dims b{color:var(--ink);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:641px){ .seg{grid-template-columns:repeat(3,auto);justify-content:center} .seg button{min-width:150px} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Transformable Box</h1>
      <p>Stool · Storage · Study desk</p>
    </div>
    <span class="by">by <b>Noor</b></span>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" tabindex="0" aria-label="Interactive 3D model of a transformable box. Drag a box to fold it and drag a front panel to open the desk; use the buttons to snap to a configuration."></canvas>
    <div class="hint" id="hint">Drag a box to fold it · drag a front panel to open the desk</div>
    <div class="status" id="status">Loading…</div>
  </div>

  <div class="dock">
    <div class="caption"><b id="capTitle">Stool</b><span id="capText"></span></div>
    <div class="seg" role="group" aria-label="Configuration">
      <button id="bStool"  aria-pressed="true">Stool<small>two side by side</small></button>
      <button id="bStorage" aria-pressed="false">Storage<small>fold &amp; stack</small></button>
      <button id="bDesk"   aria-pressed="false">Study desk<small>fold-down panel</small></button>
    </div>
    <div class="dims">
      <span>Each box <b>450 × 450 × 450 mm</b></span>
      <span>Cabinet <b>450 × 900 × 450 mm</b></span>
      <span>Desk panel <b>450 mm</b></span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
const S = 0.45, T = 0.018, H = S / 2;

const stage = document.getElementById('stage');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 100);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 0.7; controls.maxDistance = 6;
controls.target.set(0, 0.42, 0);
camera.position.set(1.25, 1.0, 1.5);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

function themeColors() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light'
            || document.documentElement.dataset.theme === 'dark';
  scene.background = new THREE.Color(dark ? 0x201b14 : 0xe7ddcb);
  scene.fog = new THREE.Fog(dark ? 0x201b14 : 0xe7ddcb, 6, 16);
}
themeColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', themeColors);

scene.add(new THREE.HemisphereLight(0xfff6e8, 0x5a4e3c, 0.45));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.position.set(2.2, 3.6, 2.4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -2.2, right: 2.2, top: 2.2, bottom: -2.2, near: 0.5, far: 12 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const woodFace = new THREE.MeshStandardMaterial({ color: 0xc2924f, roughness: 0.75, metalness: 0, envMapIntensity: 0.5 });
const woodIn   = new THREE.MeshStandardMaterial({ color: 0xa9793c, roughness: 0.82, metalness: 0, envMapIntensity: 0.45 });
const metal    = new THREE.MeshStandardMaterial({ color: 0x70757b, roughness: 0.4, metalness: 0.75 });
const edgeMat  = new THREE.LineBasicMaterial({ color: 0x5f4a30, transparent: true, opacity: 0.25 });

// "Noor" branding stamp as a canvas texture
function markTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 132;
  const g = c.getContext('2d'); g.clearRect(0, 0, 256, 132);
  g.fillStyle = 'rgba(74,58,36,0.52)';
  g.font = '700 italic 66px Georgia, "Times New Roman", serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('Noor', 128, 62);
  g.strokeStyle = 'rgba(74,58,36,0.38)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(78, 100); g.lineTo(178, 100); g.stroke();
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; t.encoding = THREE.sRGBEncoding; return t;
}
const MARK_TEX = markTexture();
function addMark(parent, x, y, z, rotY, w) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * 0.52),
    new THREE.MeshBasicMaterial({ map: MARK_TEX, transparent: true, depthWrite: false }));
  m.position.set(x, y, z); m.rotation.y = rotY; parent.add(m); return m;
}

function panel(w, h, d, mat, joint) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true; m.receiveShadow = true; if (joint) m.userData.joint = joint; g.add(m);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), edgeMat));
  return g;
}
// open-front carcass (open +Z) + shelf + a "Noor" stamp on each outer side
function carcass(joint) {
  const g = new THREE.Group();
  const add = (w, h, d, m, px, py, pz) => { const p = panel(w, h, d, m, joint); p.position.set(px, py, pz); g.add(p); };
  add(S, S, T, woodFace, 0, 0, -H + T / 2);        // back
  add(T, S, S, woodFace, -H + T / 2, 0, 0);        // left
  add(T, S, S, woodFace,  H - T / 2, 0, 0);        // right
  add(S, T, S, woodFace, 0,  H - T / 2, 0);        // top
  add(S, T, S, woodFace, 0, -H + T / 2, 0);        // bottom
  add(S - 2 * T, T, S - T, woodIn, 0, 0, T / 2);   // shelf
  addMark(g,  H + 0.002, 0, 0,  Math.PI / 2, 0.30); // right side
  addMark(g, -H - 0.002, 0, 0, -Math.PI / 2, 0.30); // left side
  return g;
}

// identical fold-down front door for a box. hy = hinge edge (±H), sign = fold direction.
const HINGE = {};
function makeDoor(box, hy, sign, key) {
  const hinge = new THREE.Group(); hinge.position.set(0, hy, H); box.add(hinge);
  const pan = panel(S - 2 * T, S - 2 * T, T, woodFace, key);
  pan.position.set(0, -hy, 0);                      // covers the whole front from the hinge edge
  addMark(pan, 0, 0, T / 2 + 0.002, 0, 0.30);       // "Noor" on the door face
  hinge.add(pan);
  HINGE[key] = hinge;
  return { hinge, sign, key };
}

// box A (static) and box B (folds about the spine)
const boxA = carcass('spine'); boxA.position.set(-H, H, 0); scene.add(boxA);
const spine = new THREE.Group(); spine.position.set(0, S, 0); scene.add(spine);
const boxB = carcass('spine'); boxB.position.set(H, -H, 0); spine.add(boxB);

const doorA = makeDoor(boxA, -H,  1, 'deskA');       // not flipped → bottom hinge, +fold
const doorB = makeDoor(boxB,  H, -1, 'deskB');       // flipped in storage → top hinge, -fold
const doors = [doorA, doorB];

// piano hinge barrel on the spine
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, S - 0.03, 14), metal);
barrel.rotation.x = Math.PI / 2; barrel.castShadow = true; spine.add(barrel);

// support bracket under the desk (box B's door)
const bracket = new THREE.Group(); bracket.position.set(0, H, H - 0.01); boxB.add(bracket);
const legL = panel(T, 0.30, T * 1.4, metal); legL.position.set(-0.17, -0.15, 0); bracket.add(legL);
const legR = panel(T, 0.30, T * 1.4, metal); legR.position.set( 0.17, -0.15, 0); bracket.add(legR);
[legL, legR].forEach(l => l.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; } }));

// ---- joint state ----
const joint = { spine: 0, deskA: 0, deskB: 0 };
const LIMIT = { spine: [0, Math.PI], deskA: [0, Math.PI / 2], deskB: [0, Math.PI / 2] };
const clamp = (v, [a, b]) => Math.min(b, Math.max(a, v));
function apply() {
  spine.rotation.z = joint.spine;
  doorA.hinge.rotation.x = doorA.sign * joint.deskA;
  doorB.hinge.rotation.x = doorB.sign * joint.deskB;
  const t = joint.deskB / (Math.PI / 2);
  bracket.rotation.x = -t * 1.15;
  const show = t > 0.04;
  [legL, legR].forEach(l => l.traverse(o => { if (o.isMesh) { o.visible = show; o.material.opacity = Math.min(1, t * 2); } }));
}

const PRESET = {
  stool:   { spine: 0,       deskA: 0, deskB: 0 },
  storage: { spine: Math.PI, deskA: 0, deskB: 0 },
  desk:    { spine: Math.PI, deskA: 0, deskB: Math.PI / 2 },
};
const CAPTION = {
  stool:   ['Stool',      'Two identical box stools side by side, joined by the top hinge. Drag either box to fold.'],
  storage: ['Storage',    'Box B folds over the hinge onto box A — a 450 × 900 × 450 cabinet.'],
  desk:    ['Study desk', 'The upper front panel folds down on its hinge, caught by the support bracket.'],
};
function setButtons(name) {
  ['bStool', 'bStorage', 'bDesk'].forEach(id => document.getElementById(id).setAttribute('aria-pressed', id.toLowerCase().includes(name)));
  const [t, txt] = CAPTION[name];
  document.getElementById('capTitle').textContent = t; document.getElementById('capText').textContent = txt;
}
let anim = null;
function goTo(name) {
  setButtons(name);
  const to = PRESET[name];
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { Object.assign(joint, to); anim = null; return; }
  const from = { ...joint }, start = performance.now(), dur = 1100;
  const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  anim = now => {
    const k = Math.min(1, (now - start) / dur), e = ease(k);
    for (const key of ['spine', 'deskA', 'deskB']) joint[key] = from[key] + (to[key] - from[key]) * e;
    if (k >= 1) anim = null;
  };
}
document.getElementById('bStool').onclick   = () => goTo('stool');
document.getElementById('bStorage').onclick = () => goTo('storage');
document.getElementById('bDesk').onclick    = () => goTo('desk');

// ---- direct manipulation ----
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragTargets = [];
scene.traverse(o => { if (o.isMesh && o.userData.joint) dragTargets.push(o); });

function axisOf(name) {
  if (name === 'spine') return { axis: new THREE.Vector3(0, 0, 1), pivot: new THREE.Vector3(0, S, 0) };
  const hinge = HINGE[name];
  const pivot = new THREE.Vector3(); hinge.getWorldPosition(pivot);
  const axis = new THREE.Vector3(1, 0, 0).transformDirection(hinge.matrixWorld).normalize();
  return { axis, pivot };
}
function setNDC(e) { const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); }
function radial(P, axis, pivot) { const d = P.clone().sub(pivot); return d.sub(axis.clone().multiplyScalar(d.dot(axis))); }
function rayPlanePoint(axis, through) {
  const o = raycaster.ray.origin, dir = raycaster.ray.direction;
  const denom = axis.dot(dir); if (Math.abs(denom) < 1e-5) return null;
  const t = axis.dot(through.clone().sub(o)) / denom; if (t < 0) return null;
  return o.clone().add(dir.clone().multiplyScalar(t));
}
let drag = null;
canvas.addEventListener('pointerdown', e => {
  setNDC(e); raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(dragTargets, false)[0];
  if (!hit) return;
  const name = hit.object.userData.joint;
  const { axis, pivot } = axisOf(name);
  const r0 = radial(hit.point, axis, pivot); if (r0.lengthSq() < 1e-6) return;
  drag = { name, axis, pivot, grab: hit.point.clone(), r0: r0.normalize(), a0: joint[name] };
  controls.enabled = false; canvas.classList.add('grabbing'); canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  setNDC(e); raycaster.setFromCamera(ndc, camera);
  const P = rayPlanePoint(drag.axis, drag.grab); if (!P) return;
  const r = radial(P, drag.axis, drag.pivot); if (r.lengthSq() < 1e-6) return;
  r.normalize();
  const signed = Math.atan2(drag.axis.dot(new THREE.Vector3().crossVectors(drag.r0, r)), drag.r0.dot(r));
  joint[drag.name] = clamp(drag.a0 + signed, LIMIT[drag.name]); anim = null;
});
function endDrag() {
  if (!drag) return;
  const stops = drag.name === 'spine' ? [0, Math.PI] : [0, Math.PI / 2];
  for (const s of stops) if (Math.abs(joint[drag.name] - s) < 0.13) joint[drag.name] = s;
  drag = null; controls.enabled = true; canvas.classList.remove('grabbing');
  const near = joint.spine < 0.4 ? 'stool' : (joint.deskB > 0.5 ? 'desk' : 'storage');
  setButtons(near);
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// hint toast
const hintEl = document.getElementById('hint');
let hintTimer = setTimeout(() => hintEl.classList.add('gone'), 6000);
canvas.addEventListener('pointerdown', () => { hintEl.classList.add('gone'); clearTimeout(hintTimer); }, { once: true });

// framing
const camTarget = new THREE.Vector3(0, 0.42, 0);
const cA = new THREE.Vector3(), cB = new THREE.Vector3();
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

setButtons('stool'); apply();
document.getElementById('status').hidden = true;

function tick(now) {
  if (anim) anim(now);
  apply();
  boxA.getWorldPosition(cA); boxB.getWorldPosition(cB);
  camTarget.lerp(cA.clone().add(cB).multiplyScalar(0.5).setY(0.42), 0.05);
  controls.target.copy(camTarget); controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
